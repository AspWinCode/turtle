<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Черепашка</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-group">
          <button id="mode-blocks" class="mode-btn" type="button">🧩 Блоки</button>
          <button id="mode-code" class="mode-btn active" type="button">⌨️ Код</button>
        </div>
        <div class="toolbar-group">
          <button id="save-btn" class="action-btn" type="button">💾 Сохранить</button>
          <button id="open-btn" class="action-btn" type="button">📂 Открыть</button>
          <input id="open-file" type="file" accept="application/json,.json" hidden />
        </div>
        <div class="toolbar-group">
          <button id="run-btn" class="action-btn run" type="button">▶ Запустить</button>
          <button id="stop-btn" class="action-btn stop" type="button" disabled>⏹ Стоп</button>
          <button id="clear-btn" class="action-btn" type="button">🧹 Очистить</button>
        </div>
      </header>
      <main id="workspace-area">
        <section id="editor-pane">
          <div id="blockly-editor"></div>
          <div id="code-editor"></div>
        </section>
        <section id="canvas-pane">
          <div id="turtle-canvas"></div>
          <div id="status-bar"></div>
        </section>
      </main>
    </div>
    <!-- Настоящий Python в браузере — реализует полный модуль turtle
         (forward/circle/write/Screen/... — см. README). UMD-сборки,
         поэтому обычные <script>, не ES-модули. -->
    <script src="/vendor/skulpt/skulpt.min.js"></script>
    <script src="/vendor/skulpt/skulpt-stdlib.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
