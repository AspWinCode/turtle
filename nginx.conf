server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html и Skulpt (public/vendor) — без кэша: они не в имени файла
    # не содержат hash сборки, а задание живёт в iframe, который никогда не
    # перемонтируется между запусками (см. Codelab StepIframeTaskView) — без
    # явного no-cache браузер студента мог показывать старую версию даже
    # после жёсткого Ctrl+F5, потому что решал, что кэш ещё не протух
    # (эвристическое кэширование при отсутствии Cache-Control).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /vendor/ {
        add_header Cache-Control "no-cache";
    }

    # /assets/* у Vite — с хэшем в имени файла (index-XXXXXXXX.js), поэтому
    # можно кэшировать агрессивно и надолго: изменится контент — изменится
    # и имя файла, новый index.html будет ссылаться уже на него.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
